<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RTG Online – Client Login</title>
  <link rel="stylesheet" href="/pages/assets/css/client.css">
</head>
<body class="client-body" data-page="login">

  <main class="client-main client-login-wrapper">
    <div class="client-card">
      <div class="client-card-header">
        <h2>Client Login</h2>
        <span>Access your jobs and messages</span>
      </div>

      <form class="client-form" id="loginForm">
        <div class="client-field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required>
        </div>
        <div class="client-btn-row">
          <button type="submit" class="client-btn client-btn-primary">Login</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="/rtg-online/client/js/client.js"></script>
</body>
</html>
