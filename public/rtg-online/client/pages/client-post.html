<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RTG Online – Post Job</title>
  <link rel="stylesheet" href="/rtg-online/client/css/client.css">
</head>
<body class="client-body" data-page="post-job">

  <!-- TOP BAR (same as dashboard) -->
  <header class="client-topbar">
    <div class="client-topbar-left">
      <img src="/assets/img/rtg-logo.jpg" class="client-logo" alt="RTG">
      <div>
        <div class="client-top-title">RTG Online Client</div>
        <div class="client-top-sub" id="clientTopName">Loading…</div>
      </div>
    </div>
    <div class="client-topbar-right">
      <a href="/pages/client/dashboard.html">Dashboard</a>
      <a href="/pages/client/post-job.html">Post Job</a>
      <a href="/pages/client/jobs.html">Jobs</a>
      <a href="/pages/client/messages.html">Messages</a>
      <a href="/pages/client/settings.html">Settings</a>
    </div>
  </header>

  <main class="client-main">
    <section class="client-card">
      <div class="client-card-header">
        <h2>Post a Job ($10)</h2>
        <span>Describe your tree work clearly</span>
      </div>

      <form class="client-form" id="postJobForm">
        <div class="client-field">
          <label for="jobTitle">Job Title</label>
          <input id="jobTitle" name="title" placeholder="Example: Remove oak over house">
        </div>

        <div class="client-field">
          <label for="jobDescription">Description</label>
          <textarea id="jobDescription" name="description" rows="4"
            placeholder="Explain the work, hazards, access, cleanup, etc."></textarea>
        </div>

        <div class="client-field">
          <label for="jobBudget">Budget ($)</label>
          <input id="jobBudget" name="budget" type="number" step="0.01">
        </div>

        <div class="client-field">
          <label>
            <input type="checkbox" id="jobFlexible" name="flexible">
            I might be willing to spend more if more work can be done.
          </label>
        </div>

        <div class="client-field">
          <label for="jobBestDays">Best Days (comma separated)</label>
          <input id="jobBestDays" name="best_days" placeholder="Example: Monday, Wednesday, Saturday">
        </div>

        <div class="client-field">
          <label for="jobBestTime">Best Time to Contact</label>
          <input id="jobBestTime" name="best_time" placeholder="Example: After 5 PM">
        </div>

        <div class="client-field">
          <label for="jobAddress">Job Address</label>
          <input id="jobAddress" name="address" placeholder="Street, city, state">
        </div>

        <div class="client-btn-row">
          <button type="submit" class="client-btn client-btn-primary">Post Job</button>
          <button type="button" class="client-btn client-btn-secondary"
            onclick="history.back()">Cancel</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="/rtg-online/client/js/client.js"></script>
</body>
</html>
