<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RTG Online – Client Dashboard</title>

  <!-- SOCIAL PREVIEW -->
  <meta property="og:title" content="RTG Online – Client Dashboard">
  <meta property="og:description" content="Manage your tree job listings, messages, contracts, billing, and settings.">
  <meta property="og:image" content="/public/assets/img/rtg-logo.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rtg.realtreeguy.com/client/dashboard">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RTG Online – Client Dashboard">
  <meta name="twitter:description" content="Your control center for posting and managing tree jobs.">
  <meta name="twitter:image" content="/public/assets/img/rtg-logo.jpg">

  <!-- FAVICON -->
  <link rel="icon" type="image/jpeg" href="/public/assets/img/rtg-logo.jpg">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GLOBAL CLIENT CSS -->
  <link rel="stylesheet" href="/pages/assets/css/client.css">
</head>

<body class="client-body" data-page="dashboard">

  <!-- ============================================================
       TOP BAR (Unified)
  ============================================================ -->
  <header class="client-topbar">
    <div class="client-topbar-left">
      <img src="/public/assets/img/rtg-logo.jpg" class="client-logo" alt="RTG">
      <div>
        <div class="client-top-title">RTG Online Client</div>
        <div class="client-top-sub" id="clientTopName">Loading…</div>
      </div>
    </div>

    <div class="client-topbar-right">
      <a href="/pages/client/dashboard.html">Dashboard</a>
      <a href="/pages/client/post-job.html">Post Job</a>
      <a href="/pages/client/jobs.html">Jobs</a>
      <a href="/pages/client/messages.html">Messages</a>
      <a href="/pages/client/contracts.html">Contracts</a>
      <a href="/pages/client/billing.html">Billing</a>
      <a href="/pages/client/settings.html">Settings</a>
    </div>
  </header>

  <!-- ============================================================
       MAIN CONTENT
  ============================================================ -->
  <main class="client-main">

    <!-- QUICK ACTIONS -->
    <section class="client-card">
      <div class="client-card-header">
        <h2>Quick Actions</h2>
        <span>Post jobs, view jobs, check messages</span>
      </div>

      <div class="client-grid">
        <a href="/pages/client/post-job.html" class="client-grid-link">
          <span class="icon">📤</span>
          <span class="label">Post a Job ($10)</span>
        </a>

        <a href="/pages/client/jobs.html" class="client-grid-link">
          <span class="icon">📋</span>
          <span class="label">My Jobs</span>
        </a>

        <a href="/pages/client/messages.html" class="client-grid-link">
          <span class="icon">💬</span>
          <span class="label">Messages</span>
        </a>

        <a href="/pages/client/contracts.html" class="client-grid-link">
          <span class="icon">📄</span>
          <span class="label">Contracts</span>
        </a>

        <a href="/pages/client/billing.html" class="client-grid-link">
          <span class="icon">💳</span>
          <span class="label">Billing</span>
        </a>

        <a href="/pages/client/settings.html" class="client-grid-link">
          <span class="icon">⚙️</span>
          <span class="label">Settings</span>
        </a>
      </div>
    </section>

    <!-- RECENT JOBS -->
    <section class="client-card">
      <div class="client-card-header">
        <h2>Recent Jobs</h2>
        <span>Your latest posted jobs</span>
      </div>
      <div id="dashboardJobs"></div>
    </section>

    <!-- NOTIFICATIONS -->
    <section class="client-card">
      <div class="client-card-header">
        <h2>Notifications</h2>
        <span>Updates from tree guys</span>
      </div>
      <div id="notifBox"></div>
    </section>

  </main>

  <!-- GLOBAL CLIENT JS -->
  <script type="module" src="/rtg-online/client/js/client.js"></script>

</body>
</html>
